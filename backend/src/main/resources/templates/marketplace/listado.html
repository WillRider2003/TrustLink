<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Marketplace')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <div class="page-header">
        <div>
            <h1>Marketplace</h1>
            <p class="subtitle">Compra con la garantía del escrow: tu pago solo se libera cuando confirmas la entrega.</p>
        </div>
        <a href="/marketplace/publicar" class="btn btn-primary">+ Publicar producto</a>
    </div>

    <div class="grid-productos" th:if="${not #lists.isEmpty(productos)}">
        <a th:each="p : ${productos}" th:href="@{/marketplace/producto/{id}(id=${p.id})}" class="producto-card">
            <img th:if="${p.fotoUrl}" th:src="@{'/' + ${p.fotoUrl}}" class="foto" alt="Producto">
            <div class="foto" th:unless="${p.fotoUrl}" style="display:flex;align-items:center;justify-content:center;color:var(--tl-grey-600);">Sin foto</div>
            <div class="info">
                <div class="nombre" th:text="${p.nombre}">Nombre del producto</div>
                <div class="precio" th:text="'S/ ' + ${p.precioSoles}">S/ 0.00</div>
                <div class="vendedor">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:3px;"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                    <span th:text="${p.vendedor.nombreCompleto}">Vendedor</span>
                </div>
            </div>
        </a>
    </div>

    <div class="card" th:if="${#lists.isEmpty(productos)}" style="text-align:center; padding:60px 20px;">
        <p style="color:var(--tl-grey-600); font-size:1rem;">Todavía no hay productos publicados.</p>
        <a href="/marketplace/publicar" class="btn btn-primary" style="margin-top:16px; display:inline-flex;">Sé el primero en publicar</a>
    </div>
</div>
</body>
</html>
