<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${producto.nombre})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container" style="max-width:720px;">
    <div class="alert alert-error" th:if="${errorGeneral}" th:text="${errorGeneral}"></div>

    <div class="card" style="display:flex; gap:24px; flex-wrap:wrap;">
        <img th:if="${producto.fotoUrl}" th:src="@{'/' + ${producto.fotoUrl}}"
             style="width:260px; height:260px; object-fit:cover; border-radius:var(--tl-radius-md); flex-shrink:0;">
        <div style="flex:1; min-width:220px;">
            <h1 style="font-size:1.5rem; font-weight:900; margin-bottom:8px;" th:text="${producto.nombre}">Producto</h1>
            <div class="precio" style="font-size:1.8rem; font-weight:900; color:var(--tl-red); margin-bottom:12px;"
                 th:text="'S/ ' + ${producto.precioSoles}">S/ 0.00</div>
            <p style="color:var(--tl-grey-600); margin-bottom:16px;" th:text="${producto.descripcion}">Descripción</p>

            <div class="card-flat" style="margin-bottom:20px;">
                <div style="font-size:0.8rem; color:var(--tl-grey-600); font-weight:700; margin-bottom:4px;">VENDEDOR</div>
                <div style="font-weight:800;" th:text="${producto.vendedor.nombreCompleto}">Vendedor</div>
            </div>

            <form th:action="@{/marketplace/comprar/{id}(id=${producto.id})}" method="post"
                  th:if="${usuarioActual.id != producto.vendedor.id}">
                <button type="submit" class="btn btn-primary btn-block" style="display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5.5 3.4 9.7 8 11 4.6-1.3 8-5.5 8-11V5l-8-3z"/></svg>
                    Comprar con pago protegido
                </button>
            </form>
            <p th:if="${usuarioActual.id == producto.vendedor.id}" style="color:var(--tl-grey-600); font-size:0.88rem;">
                Este es tu propio producto.
            </p>
        </div>
    </div>

    <div class="card" style="margin-top:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <div style="font-weight:800; font-size:1.05rem;">Reseñas</div>
            <div th:if="${promedio > 0}" style="font-weight:800; color:var(--tl-red);">
                <span th:text="${promedio}">4.5</span> / 5
            </div>
        </div>
        <p th:if="${#lists.isEmpty(resenas)}" style="color:var(--tl-grey-600); font-size:0.9rem;">
            Este producto todavía no tiene reseñas.
        </p>
        <div th:each="r : ${resenas}" class="card-flat" style="margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between;">
                <strong th:text="${r.comprador.nombreCompleto}">Comprador</strong>
                <span style="color:var(--tl-red); font-weight:800;" th:text="${r.calificacion} + ' / 5'">5 / 5</span>
            </div>
            <p th:if="${r.comentario}" style="font-size:0.88rem; color:var(--tl-grey-600); margin-top:6px;" th:text="${r.comentario}"></p>
            <div style="font-size:0.75rem; color:var(--tl-grey-600); margin-top:6px;" th:text="${#temporals.format(r.creadoEn, 'dd/MM/yyyy')}"></div>
        </div>
    </div>
</div>
</body>
</html>
