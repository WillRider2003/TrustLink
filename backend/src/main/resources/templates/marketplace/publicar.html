<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Publicar producto')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container" style="max-width:560px;">
    <div class="page-header">
        <div>
            <h1>Publicar producto</h1>
            <p class="subtitle">Tu producto aparecerá en el marketplace al instante.</p>
        </div>
    </div>

    <div class="card">
        <div class="alert alert-error" th:if="${errorGeneral}" th:text="${errorGeneral}"></div>

        <form th:action="@{/marketplace/publicar}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Martillo de carpintero" style="padding-left:14px;" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción (opcional)</label>
                <textarea id="descripcion" name="descripcion" class="form-control" rows="3" style="padding-left:14px; resize:vertical;" placeholder="Describe tu producto..."></textarea>
            </div>

            <div class="form-group">
                <label for="precioSoles">Precio en Soles (S/)</label>
                <input type="number" id="precioSoles" name="precioSoles" step="0.01" min="0.01" class="form-control" placeholder="25.00" style="padding-left:14px;" required>
            </div>

            <div class="form-group">
                <label for="foto">Foto del producto</label>
                <input type="file" id="foto" name="foto" class="form-control" style="padding-left:14px;" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Publicar producto</button>
        </form>
    </div>
</div>
</body>
</html>
