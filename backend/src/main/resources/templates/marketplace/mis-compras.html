<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis compras')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <div class="page-header">
        <div>
            <h1>Mis compras</h1>
            <p class="subtitle">Historial de tus órdenes protegidas por escrow.</p>
        </div>
    </div>

    <div class="card" th:if="${#lists.isEmpty(ordenes)}" style="text-align:center; padding:60px 20px;">
        <p style="color:var(--tl-grey-600);">Todavía no has comprado nada.</p>
        <a href="/marketplace" class="btn btn-primary" style="margin-top:16px; display:inline-flex;">Ir al marketplace</a>
    </div>

    <div th:if="${not #lists.isEmpty(ordenes)}" style="display:flex; flex-direction:column; gap:12px;">
        <a th:each="o : ${ordenes}" th:href="@{/marketplace/orden/{id}(id=${o.id})}" class="card-flat"
           style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
                <div style="font-weight:800;" th:text="${o.producto.nombre}">Producto</div>
                <div style="font-size:0.82rem; color:var(--tl-grey-600);" th:text="'S/ ' + ${o.montoSoles} + ' · ' + ${o.vendedor.nombreCompleto}">Detalle</div>
            </div>
            <span class="badge badge-custodia" th:if="${o.estado.name() == 'EN_CUSTODIA'}">En custodia</span>
            <span class="badge badge-liberado" th:if="${o.estado.name() == 'LIBERADO'}">Liberado</span>
            <span class="badge badge-disputa" th:if="${o.estado.name() == 'EN_DISPUTA'}">En disputa</span>
            <span class="badge badge-reembolsado" th:if="${o.estado.name() == 'REEMBOLSADO'}">Reembolsado</span>
        </a>
    </div>
</div>
</body>
</html>
