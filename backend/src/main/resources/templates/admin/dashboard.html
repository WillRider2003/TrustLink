<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Panel Admin')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <div class="page-header">
        <div>
            <h1>Panel de administración</h1>
            <p class="subtitle">Vista general de TrustLink.</p>
        </div>
        <div style="display:flex; gap:10px;">
            <a href="/admin/usuarios" class="btn btn-secondary btn-sm">Usuarios</a>
            <a href="/admin/solicitudes-vendedor" class="btn btn-secondary btn-sm">Solicitudes</a>
            <a href="/admin/disputas" class="btn btn-secondary btn-sm">Disputas</a>
            <a href="/admin/auditoria" class="btn btn-secondary btn-sm">Auditoría</a>
        </div>
    </div>

    <div class="metricas-grid">
        <div class="metrica-card">
            <div class="valor" th:text="${metricas.totalUsuarios}">0</div>
            <div class="label">Usuarios</div>
        </div>
        <div class="metrica-card">
            <div class="valor" th:text="${metricas.totalProductos}">0</div>
            <div class="label">Productos</div>
        </div>
        <div class="metrica-card">
            <div class="valor" th:text="${metricas.ordenesEnCustodia}">0</div>
            <div class="label">En custodia</div>
        </div>
        <div class="metrica-card">
            <div class="valor" th:text="${metricas.ordenesLiberadas}">0</div>
            <div class="label">Liberadas</div>
        </div>
        <div class="metrica-card">
            <div class="valor" th:text="${metricas.ordenesEnDisputa}">0</div>
            <div class="label">En disputa</div>
        </div>
        <div class="metrica-card">
            <div class="valor" th:text="${metricas.usuariosBaneados}">0</div>
            <div class="label">Baneados</div>
        </div>
    </div>
</div>
</body>
</html>
