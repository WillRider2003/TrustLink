<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Notificaciones')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container" style="max-width:640px;">
    <div class="page-header">
        <div>
            <h1>Notificaciones</h1>
            <p class="subtitle">Tus avisos más recientes.</p>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(notificaciones)}" style="color:var(--tl-grey-600); text-align:center; padding:24px;">
        Aún no tienes notificaciones.
    </p>

    <div th:each="n : ${notificaciones}" class="card-flat" style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:start; gap:10px;">
            <div>
                <div style="font-weight:800;" th:text="${n.titulo}">Título</div>
                <p style="font-size:0.88rem; color:var(--tl-grey-600); margin:4px 0;" th:text="${n.mensaje}">Mensaje</p>
                <div style="font-size:0.75rem; color:var(--tl-grey-600);" th:text="${#temporals.format(n.creadoEn, 'dd/MM/yyyy HH:mm')}"></div>
            </div>
            <a th:if="${n.enlace}" th:href="${n.enlace}" class="btn btn-secondary btn-sm">Ver</a>
        </div>
    </div>
</div>
</body>
</html>
