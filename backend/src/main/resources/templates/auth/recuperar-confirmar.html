<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nueva contraseña')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-panel-brand">
        <img src="/img/logo.png" alt="TrustLink" class="logo-shield">
        <h1>Crea una nueva<br>contraseña</h1>
        <p>Elige una contraseña segura para proteger tu cuenta y tu historial de reputación.</p>
    </div>

    <div class="auth-panel-form">
        <div class="auth-card">
            <h2>Nueva contraseña</h2>
            <p class="subtitle">Este enlace es válido por 30 minutos.</p>

            <div class="alert alert-error" th:if="${errorGeneral}" th:text="${errorGeneral}"></div>

            <form th:action="@{/auth/recuperar/confirmar}" th:object="${confirmarDTO}" method="post">
                <input type="hidden" th:field="*{token}">

                <div class="form-group">
                    <label for="nuevaContrasena">Nueva contraseña</label>
                    <input type="password" id="nuevaContrasena" th:field="*{nuevaContrasena}" class="form-control" placeholder="Mínimo 8 caracteres" style="padding-left:14px;" required>
                    <div class="field-error" th:if="${#fields.hasErrors('nuevaContrasena')}" th:errors="*{nuevaContrasena}"></div>
                </div>

                <div class="form-group">
                    <label for="confirmarContrasena">Confirmar contraseña</label>
                    <input type="password" id="confirmarContrasena" th:field="*{confirmarContrasena}" class="form-control" placeholder="Repite tu contraseña" style="padding-left:14px;" required>
                    <div class="field-error" th:if="${#fields.hasErrors('confirmarContrasena')}" th:errors="*{confirmarContrasena}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Guardar nueva contraseña</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
