# Perfil alternativo para correr la demo sin instalar MySQL.
# Uso: java -jar trustlink-backend.jar --spring.profiles.active=h2
# o en el IDE: agregar VM option -Dspring.profiles.active=h2

spring.datasource.url=jdbc:h2:file:./trustlink-h2-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
