<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Disputas')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <div class="page-header">
        <div>
            <h1>Disputas</h1>
            <p class="subtitle">Órdenes reportadas que requieren resolución manual.</p>
        </div>
        <a href="/admin" class="btn btn-secondary btn-sm">← Volver al panel</a>
    </div>

    <div class="alert alert-error" th:if="${errorGeneral}" th:text="${errorGeneral}"></div>

    <div class="card" th:if="${#lists.isEmpty(disputas)}" style="text-align:center; padding:60px 20px;">
        <p style="color:var(--tl-grey-600);">No hay disputas pendientes. 🎉</p>
    </div>

    <div th:each="d : ${disputas}" class="card-flat" style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
            <div>
                <div style="font-weight:800;" th:text="${d.producto.nombre}">Producto</div>
                <div style="font-size:0.85rem; color:var(--tl-grey-600);" th:text="'S/ ' + ${d.montoSoles}">S/ 0</div>
            </div>
            <span class="badge badge-disputa">En disputa</span>
        </div>

        <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; font-size:0.85rem;">
            <div><span style="color:var(--tl-grey-600);">Comprador:</span> <strong th:text="${d.comprador.nombreCompleto}"></strong></div>
            <div><span style="color:var(--tl-grey-600);">Vendedor:</span> <strong th:text="${d.vendedor.nombreCompleto}"></strong></div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <form th:action="@{/admin/disputas/{id}/resolver(id=${d.id})}" method="post" style="display:inline;">
                <input type="hidden" name="liberarAlVendedor" value="true">
                <button type="submit" class="btn btn-primary btn-sm" onclick="return confirm('¿Liberar el pago al vendedor?')">Liberar al vendedor</button>
            </form>
            <form th:action="@{/admin/disputas/{id}/resolver(id=${d.id})}" method="post" style="display:inline;">
                <input type="hidden" name="liberarAlVendedor" value="false">
                <button type="submit" class="btn btn-secondary btn-sm" onclick="return confirm('¿Reembolsar al comprador?')">Reembolsar al comprador</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
