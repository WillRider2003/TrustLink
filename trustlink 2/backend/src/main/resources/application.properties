spring.application.name=trustlink-backend
server.port=8080

# ============================================================
# Base de datos — MySQL por defecto. Para probar rapido sin instalar
# MySQL, comenten este bloque y usen application-h2.properties
# (ver seccion mas abajo / README) con: --spring.profiles.active=h2
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/trustlink?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Rosell2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Archivos subidos (fotos de perfil y de producto)
# ============================================================
trustlink.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# ============================================================
# Correo (recuperacion de contraseña). Si no configuran SMTP,
# el enlace de recuperacion se muestra igual en pantalla para
# que la demo funcione sin depender de un correo real.
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Cifrado de claves privadas de wallets embebidas.
# IMPORTANTE: la clave de abajo es solo un EJEMPLO VÁLIDO (32 bytes tras
# decodificar Base64, como exige AES-256). Generen la suya propia antes
# de la demo con:
#   openssl rand -base64 32
# y reemplacen el valor de abajo (nunca usen el de ejemplo en producción).
# ============================================================
trustlink.wallet.master-key=5trJ6bH+qXyVbTWVtsws4V0P8gbUhYci2lS273btMZo=

# ============================================================
# Blockchain: Arbitrum Sepolia via Web3j
# Completar despues de correr contracts/deploy_arbitrum_sepolia.js
# ============================================================
trustlink.web3.rpc-url=https://sepolia-rollup.arbitrum.io/rpc
trustlink.web3.chain-id=421614
