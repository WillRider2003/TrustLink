# (contracts/.env -> PRIVATE_KEY), para que tenga permisos de owner.
trustlink.web3.backend-private-key=c2335cd1a22e08a94cd3635016bca4866eb6b4e8dcef94bf50533c7c7c8f0d0c

# Direcciones de los contratos desplegados (ver deployed_addresses.json
