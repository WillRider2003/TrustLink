<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustLink — Acceso Demo</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="login">

<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="img/logo.png" alt="TrustLink" onerror="this.style.display='none'">
      <div class="login-brand-text">Trust<span>Link</span></div>
    </div>
    <div class="login-tagline">Marketplace con escrow y crédito on-chain para vendedores informales</div>

    <div class="demo-hackathon-tag">⚡ Demo día · Hackathon BUIDL / Arbitrum</div>

    <div class="role-buttons">
      <button class="role-btn comprador" onclick="tlEntrarComo('comprador')">
        <div class="role-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg></div>
        <div class="role-btn-text">
          <div class="role-btn-title">Entrar como Comprador</div>
          <div class="role-btn-desc">Explora el marketplace y compra con escrow</div>
        </div>
        <div class="role-btn-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg></div>
      </button>

      <button class="role-btn vendedor" onclick="tlEntrarComo('vendedor')">
        <div class="role-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l1-5h16l1 5"/><path d="M3 9h18v11H3z"/><path d="M8 14h8"/></svg></div>
        <div class="role-btn-text">
          <div class="role-btn-title">Entrar como Vendedor</div>
          <div class="role-btn-desc">Publica productos y revisa tu crédito progresivo</div>
        </div>
        <div class="role-btn-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg></div>
      </button>

      <button class="role-btn superadmin" onclick="tlEntrarComo('superadmin')">
        <div class="role-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg></div>
        <div class="role-btn-text">
          <div class="role-btn-title">Entrar como Superadmin</div>
          <div class="role-btn-desc">Modera usuarios y resuelve disputas</div>
        </div>
        <div class="role-btn-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg></div>
      </button>
    </div>

    <div class="login-footer-note">
      Esta es una demo estática sin base de datos, pensada para el demo day.<br>
      Los tres accesos son simulados — no requieren contraseña.
    </div>
  </div>
</div>

<script>
function tlEntrarComo(rol) {
  sessionStorage.setItem('tl_rol', rol);
  window.location.href = 'marketplace.html';
}
</script>
</body>
</html>
