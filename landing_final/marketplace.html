<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace — TrustLink</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body data-page="marketplace" data-active-link="marketplace.html">

  <div class="app-shell">
    <div id="sidebarMount"></div>

    <div class="main-content">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle" id="menuToggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M3 12h18M3 6h18M3 18h18" />
            </svg>
          </button>
          <div>
            <div class="topbar-title">Marketplace</div>
            <div class="topbar-subtitle">Productos verificados de vendedores con reputación on-chain</div>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="chip-live">Arbitrum Sepolia</span>
        </div>
      </header>

      <div class="content-body">
        <div class="product-grid" id="marketplaceGrid"></div>
      </div>
    </div>
  </div>

  <!-- Modal comprar -->
  <div class="overlay" id="comprarOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Comprar con escrow</div>
        <button class="modal-close" onclick="tlCloseComprarModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 6L6 18M6 6l18 18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div
          style="display:flex; gap:14px; margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--tl-grey-200);">
          <img id="modalProductoImg" style="width:64px; height:64px; border-radius:10px; object-fit:cover;" src="">
          <div>
            <div style="font-weight:800; font-size:0.95rem;" id="modalProductoNombre"></div>
            <div style="font-weight:800; color:var(--tl-red-dark); font-size:1.1rem; margin-top:4px;"
              id="modalProductoPrecio"></div>
          </div>
        </div>

        <div class="panel-subtitle" style="margin-bottom:14px;">Así protege tu dinero el contrato TrustLinkEscrow:</div>
        <div class="escrow-timeline" id="escrowTimeline"></div>

        <button class="btn btn-primary btn-block" style="margin-top:20px;" id="btnConfirmarCompra"
          onclick="tlConfirmarCompra()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0110 0v4" />
          </svg>
          Confirmar y depositar en escrow
        </button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>
  <div id="chatbotMount"></div>

  <script src="js/data.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rol = sessionStorage.getItem('tl_rol');
      tlRenderProductGrid('marketplaceGrid', { rol });
    });
  </script>
</body>

</html>
