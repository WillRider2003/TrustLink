<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis pedidos — TrustLink (Demo)</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="mis-pedidos" data-active-link="mis-pedidos.html">
<script>if(localStorage.getItem("tl_dark_mode")==="1")document.body.classList.add("dark");</script>


<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main-content">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" id="menuToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div>
          <div class="topbar-title" id="pedidosTitle">Mis pedidos</div>
          <div class="topbar-subtitle">El dinero queda en escrow hasta que ambas partes confirmen la entrega</div>
        </div>
      </div>
      <div id="topbarNotifMount" style="position:relative;"></div>
    </header>

    <div class="content-body">
      <div id="pedidosLista" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<div id="chatbotMount"></div>

<script src="js/data.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/chatbot-widget.js"></script>
<script src="js/app.js"></script>
<script>
function tlBadgeParaEstado(o) {
  if (o.estado === 'ENTREGADO') return `<span class="badge badge-green">Entregado — pago liberado</span>`;
  if (o.estado === 'EN_DISPUTA') return `<span class="badge badge-amber">En disputa</span>`;
  if (o.confirmacionVendedor && !o.confirmacionComprador) return `<span class="badge badge-amber">Esperando que confirmes tú</span>`;
  if (!o.confirmacionVendedor && o.confirmacionComprador) return `<span class="badge badge-amber">Esperando confirmación del vendedor</span>`;
  return `<span class="badge badge-dark">Esperando confirmación del vendedor</span>`;
}

function tlPedidoCardHTML(o, rol) {
  const puedeConfirmarVendedor = rol === 'vendedor' && !o.confirmacionVendedor && o.estado !== 'ENTREGADO' && o.estado !== 'EN_DISPUTA';
  const puedeConfirmarComprador = rol === 'comprador' && !o.confirmacionComprador && o.estado !== 'ENTREGADO' && o.estado !== 'EN_DISPUTA';

  return `
    <div class="panel" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:14px 18px;">
      <div style="display:flex; align-items:center; gap:12px; min-width:0;">
        <div style="min-width:0;">
          <div style="font-weight:700; font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${o.producto}</div>
          <div style="font-size:0.76rem; color:var(--tl-grey-600);">S/ ${o.monto.toFixed(2)} · ${o.fecha}</div>
        </div>
        <div style="font-size:0.72rem; color:var(--tl-grey-600); display:flex; gap:10px; white-space:nowrap;">
          <span style="display:inline-flex; align-items:center; gap:3px;">${o.confirmacionVendedor ? '✓' : '·'} Vendedor</span>
          <span style="display:inline-flex; align-items:center; gap:3px;">${o.confirmacionComprador ? '✓' : '·'} Comprador</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        ${tlBadgeParaEstado(o)}
        ${puedeConfirmarVendedor ? `<button class="btn btn-primary btn-sm" onclick="tlConfirmarParteDelPedido('${o.id}', 'vendedor')">Confirmar envío</button>` : ''}
        ${puedeConfirmarComprador ? `<button class="btn btn-primary btn-sm" onclick="tlConfirmarParteDelPedido('${o.id}', 'comprador')">Confirmar recepción</button>` : ''}
        ${o.estado !== 'ENTREGADO' && o.estado !== 'EN_DISPUTA' ? `<button class="btn btn-outline btn-sm" onclick="tlReportarIncidenciaDesdeModal('${o.id}')">Reportar</button>` : ''}
      </div>
    </div>
  `;
}

/**
 * Marca la confirmación del rol correspondiente. Solo cuando AMBAS
 * (confirmacionVendedor Y confirmacionComprador) son true, el pedido
 * pasa a ENTREGADO y se simula la liberación del pago — replicando
 * el candado de dos llaves del escrow real.
 */
function tlConfirmarParteDelPedido(pedidoId, quien) {
  const orden = TL_STATE.ordenes.find(o => o.id === pedidoId);
  if (!orden) return;

  if (quien === 'vendedor') {
    orden.confirmacionVendedor = true;
    orden.estado = 'ESPERANDO_COMPRADOR';
    tlAgregarNotificacion('comprador', 'Tu pedido está en camino', `El vendedor confirmó el envío de "${orden.producto}". Confirma la recepción cuando lo recibas.`);
    tlShowToast('Confirmaste el envío. Falta que el comprador confirme la recepción.', 'success');
  } else {
    orden.confirmacionComprador = true;
    tlAgregarNotificacion('vendedor', 'El comprador confirmó la recepción', `"${orden.producto}" — falta tu confirmación para liberar el pago.`);
    tlShowToast('Confirmaste la recepción. Falta que el vendedor confirme el envío.', 'success');
  }

  if (orden.confirmacionVendedor && orden.confirmacionComprador) {
    orden.estado = 'ENTREGADO';
    tlAgregarNotificacion('vendedor', 'Pago liberado', `Ambas partes confirmaron "${orden.producto}". Se liberaron S/ ${orden.monto.toFixed(2)} a tu cuenta.`);
    tlAgregarNotificacion('comprador', 'Pedido completado', `"${orden.producto}" fue confirmado por ambas partes. El escrow liberó el pago.`);
    tlShowToast('Ambas partes confirmaron: el escrow liberó el pago al vendedor.', 'success');
  }

  tlRenderPedidos();
  tlRenderNotifBell(sessionStorage.getItem('tl_rol'));
}

function tlReportarIncidenciaDesdeModal(pedidoId) {
  sessionStorage.setItem('tl_incidencia_pedido_prefill', pedidoId);
  window.location.href = 'reportar-incidencia.html';
}

function tlRenderPedidos() {
  const rol = sessionStorage.getItem('tl_rol');
  document.getElementById('pedidosTitle').textContent = rol === 'comprador' ? 'Mis compras' : 'Mis ventas';

  const lista = document.getElementById('pedidosLista');
  const ordenes = TL_STATE.ordenes;

  lista.innerHTML = ordenes.length
    ? ordenes.map(o => tlPedidoCardHTML(o, rol)).join('')
    : `<div class="empty-state"><div class="empty-state-title">Todavía no hay pedidos</div></div>`;
}

document.addEventListener('DOMContentLoaded', tlRenderPedidos);
</script>
</body>
</html>
